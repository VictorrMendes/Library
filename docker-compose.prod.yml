services:
  db:
    image: postgres:16-alpine
    container_name: biblioteca_db
    env_file: .env.prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: biblioteca_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: biblioteca_backend
    ports:
      - "8000:8000"
    env_file: .env.prod
    volumes:
      - ${MANGA_PATH:-/srv/biblioteca/manga}:/manga
      - uploads_data:/uploads
      - media_data:/data/media
      - covers_data:/data/covers
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: biblioteca_celery
    env_file: .env.prod
    volumes:
      - ${MANGA_PATH:-/srv/biblioteca/manga}:/manga
      - uploads_data:/uploads
      - media_data:/data/media
      - covers_data:/data/covers
    depends_on:
      - backend
    restart: unless-stopped
    command: celery -A config worker -l info -c 2

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: biblioteca_beat
    env_file: .env.prod
    depends_on:
      - backend
    restart: unless-stopped
    command: celery -A config beat -l info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: biblioteca_frontend
    ports:
      - "3001:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  covers_data:
  uploads_data:
